<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>协同编辑端到端测试页</title>
    <!-- 复刻 cherry_markdown_edit_template.tpl 的脚本加载顺序与全局变量 -->
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link href="/static/jstree/3.3.4/themes/default/style.min.css" rel="stylesheet">
    <link href="/static/css/jstree.css" rel="stylesheet">
    <link href="/static/css/markdown.css" rel="stylesheet">
    <link href="/static/cherry/cherry-markdown.css" rel="stylesheet">
    <link href="/static/katex/katex.min.css" rel="stylesheet">
    <link href="/static/css/collab.css" rel="stylesheet">
</head>
<body>

<div class="m-manual manual-editor">
    <div class="markdown-body">
        <div class="markdown-category" id="manualCategory" style="position:absolute;">
            <div class="markdown-nav">
                <div class="nav-item active"><i class="fa fa-bars" aria-hidden="true"></i> 文档</div>
                <div class="nav-plus pull-right" id="btnAddDocument"><i class="fa fa-plus" aria-hidden="true"></i></div>
                <div class="clearfix"></div>
            </div>
            <div class="markdown-tree editor-status" id="sidebar"> </div>
            <div class="markdown-editor-status">
                <div id="attachInfo" class="item">0 附件</div>
            </div>
        </div>
        <div class="markdown-editor-container" id="manualEditorContainer" style="min-width: 920px;">
        </div>
    </div>
</div>

<!-- 创建文档弹窗（editor.js 依赖） -->
<div class="modal fade" id="addDocumentModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <form method="post" id="addDocumentForm" class="form-horizontal">
            <input type="hidden" name="identify" value="testbook">
            <input type="hidden" name="doc_id" value="0">
            <input type="hidden" name="parent_id" value="0">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">创建文档</h4>
                </div>
                <div class="modal-body">
                    <input type="text" name="doc_name" id="documentName" class="form-control" maxlength="50">
                    <input type="text" name="doc_identify" id="documentIdentify" class="form-control" maxlength="50">
                </div>
            </div>
        </form>
    </div>
</div>
<!-- 附件列表（editor.js Vue 实例依赖） -->
<div id="attachList"></div>

<!-- 迁移文档弹窗（与 cherry_markdown_edit_template.tpl 保持一致） -->
<div class="modal fade" id="migrateDocumentModal" tabindex="-1" role="dialog" aria-labelledby="migrateDocumentModalLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                <h4 class="modal-title" id="migrateDocumentModalLabel">迁移文档</h4>
            </div>
            <div class="modal-body">
                <p id="migrateDocName" style="word-break: break-all;"></p>
                <div class="form-group">
                    <label for="migrateTargetBook">迁移到项目</label>
                    <select id="migrateTargetBook" class="form-control"></select>
                </div>
                <p class="text-muted" style="font-size: 12px;">该文档及其所有子文档将被移动到所选项目，并作为顶级文档排在末尾。</p>
            </div>
            <div class="modal-footer">
                <span id="migrate-error-message" class="error-message"></span>
                <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="btnMigrateDocument" data-loading-text="迁移中...">迁移</button>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    // ===== 复刻编辑页模板注入的全局变量 =====
    window.treeCatalog = null;
    window.baseUrl = "";
    window.saveing = false;
    window.katex = { js: "/static/katex/katex", css: "/static/katex/katex" };
    window.editor = null;
    window.imageUploadURL = "/api/upload";
    window.fileUploadURL = "/api/upload";
    window.documentCategory = [
        { "id": 1, "parent": "#", "text": "协同测试", "identify": "doc1", "version": 100, state: { opened: true } },
        { "id": 2, "parent": "#", "text": "第二篇文档", "identify": "doc2", "version": 100 }
    ];
    window.book = (function () {
        // 支持通过 URL 参数 role 模拟不同角色（0创始人 1管理员 2编辑者 3观察者 4未指定/超管）
        var params = new URLSearchParams(window.location.search);
        // canmigrate 参数模拟服务端下发的迁移权限标记（不传则不定义，走角色回退逻辑）
        if (params.get("canmigrate") === "1") {
            window.CAN_MIGRATE = true;
        } else if (params.get("canmigrate") === "0") {
            window.CAN_MIGRATE = false;
        }
        return { "identify": "testbook", "auto_save": 0, "role_id": parseInt(params.get("role") || "0", 10) };
    })();
    window.selectedDocId = 1;
    window.selectNode = null;
    window.deleteURL = "#";
    window.editURL = "/api/testbook/content/";
    window.releaseURL = "#";
    window.sortURL = "#";
    window.historyURL = "#";
    window.removeAttachURL = "#";
    window.highlightStyle = "github";
    window.template = { "getUrl": "#", "listUrl": "#", "deleteUrl": "#", "saveUrl": "#" };
    window.lang = "zh-CN";

    // ===== 协同编辑配置（通过 URL 参数区分不同用户：?user=A&member=1） =====
    window.ENABLE_COLLAB = true;
    window.collabTokenURL = "/api/testbook/collab-token";
    window.collabScriptURL = "/static/js/collab.min.js";
    // 迁移文档接口（模拟）
    window.migrateURL = "/api/testbook/migrate";
    window.migrateListURL = "/api/testbook/migrate/list";
    (function () {
        var params = new URLSearchParams(window.location.search);
        window.COLLAB_USER = {
            memberId: parseInt(params.get("member") || "1", 10),
            name: params.get("user") || "Tester"
        };
    })();
</script>
<script src="/static/js/array.js" type="text/javascript"></script>
<script src="/static/jquery/1.12.4/jquery.min.js"></script>
<script src="/static/vuejs/vue.min.js" type="text/javascript"></script>
<script src="/static/bootstrap/js/bootstrap.min.js"></script>
<script src="/static/jstree/3.3.4/jstree.min.js" type="text/javascript"></script>
<script src="/static/layer/layer.js" type="text/javascript"></script>
<script src="/static/js/jquery.form.js" type="text/javascript"></script>
<script src="/static/js/editor.js" type="text/javascript"></script>
<script src="/static/katex/katex.min.js" type="text/javascript"></script>
<script src="/static/js/cherry_markdown.js" type="text/javascript"></script>
<script src="/static/cherry/cherry-markdown.js" type="text/javascript"></script>
<!-- collab.min.js 由 cherry_markdown.js 动态加载（与生产一致） -->
</body>
</html>
